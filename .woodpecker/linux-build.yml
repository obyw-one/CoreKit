# .woodpecker/linux-build.yml — prove CoreKit builds AND passes its tests on Linux (spec f1a7c3e8 W3, BR-CKL-05)
#
# The core product (Repository / Cache / DI / JSON / Queue) must build with ZERO
# Apple framework on Linux. CoreKitUI is Apple-only (SwiftUI) and compiles to an
# EMPTY module off Apple, so building the whole package on Linux also confirms the
# `#if canImport(...)` guards hold. Runs on ci.obyw.one (Woodpecker), on the
# vendor-neutral official swift Linux image — the fleet convention (see shikki's
# .woodpecker/*). If a future unguarded Apple import sneaks into the core, this
# step fails here, not in a server deploy.

when:
  event: [pull_request, push, manual]  # manual = the "Exécuter un pipeline" button (operator-triggered run)
  branch: [develop, "epic/*", "feat/*", "fix/*", "agent/*", "story/*"]

# Pin to the nuc-dev Docker agent. Without a platform label the Mac agent (local
# backend, runs on the host, ignores image:) is also eligible for this workflow.
labels:
  platform: linux/amd64

variables:
  - &swift_image "swift:6.3-jammy"  # Docker Hub official Linux stable; CoreKit is swift-tools 6.1, within range

steps:
  linux-build:
    image: *swift_image
    commands:
      - swift --version
      - swift build   # all targets: CoreKit (core, must be Apple-framework-free) + CoreKitUI (empty on Linux) + CoreKitTestSupport

  # Compiling is not working: the test targets carried a data race that only the
  # Linux @Sendable Dispatch signature rejects, and .durable fell back to an
  # unlocked write. So the whole suite runs here too.
  #
  # Direct SwiftPM on purpose, the one exception to "kagami only": kagami does not
  # build on Linux (macOS-only package, private dependencies, CoreKit < 0.11).
  # Replace this with kagami once it does.
  linux-test:
    image: *swift_image
    commands:
      - swift test
