# INSTALL: copy to .github/workflows/linux.yml (the push token here lacks the workflow scope).
name: linux
# Spec f1a7c3e8 (BR-CKL-05): the CoreKit core product must build on Linux, so an
# unguarded Apple-only import fails CI here, not a server deploy.
on:
  pull_request:
  push:
    branches: [develop, main]
jobs:
  linux-build:
    runs-on: ubuntu-latest
    container: swift:6.1
    steps:
      - uses: actions/checkout@v4
      - name: Build the core product (Linux)
        run: swift build --product CoreKit
      - name: Build CoreKitTestSupport (Linux)
        run: swift build --product CoreKitTestSupport
      - name: Build CoreKitUI (must be an empty module off Apple)
        run: swift build --product CoreKitUI
